<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discord Wiki</title>
<style>
:root{--green:#16834b;--deep:#12683d;--pale:#e9f5ee;--line:#d6e2da;--text:#202923;--muted:#66736b;--bg:#f4f6f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 Arial,"Noto Sans KR",sans-serif}a{color:var(--green);text-decoration:none}a:hover{text-decoration:underline}.top{background:var(--green);color:white;border-bottom:4px solid var(--deep)}.topin{max-width:1180px;margin:auto;padding:15px 20px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}.brand{font-size:23px;font-weight:800;color:#fff;white-space:nowrap}.brand small{font-size:11px;display:block;font-weight:400;opacity:.85;line-height:1}.nav{display:flex;gap:16px}.nav a{color:#fff;font-size:14px}.search{margin-left:auto;display:flex;min-width:min(360px,100%)}input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:4px;padding:9px;background:white;color:var(--text);width:100%}.search input{border-radius:4px 0 0 4px}.search button{border-radius:0 4px 4px 0}.wrap{max-width:1180px;margin:22px auto;padding:0 20px}.layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px}.side,.panel,.article{background:#fff;border:1px solid var(--line);border-radius:5px}.side{padding:14px;height:max-content}.side h3{margin:0 0 8px;color:var(--deep);font-size:14px;border-bottom:1px solid var(--line);padding-bottom:7px}.side a{display:block;padding:5px 4px}.article{padding:24px;min-height:520px}.title{font-size:28px;margin:0 0 6px;border-bottom:2px solid var(--green);padding-bottom:10px}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}.tabs{display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:18px}.tabs button{background:var(--pale);color:var(--deep);border:1px solid var(--line);padding:7px 12px}.tabs button.active,.btn{background:var(--green);color:white;border-color:var(--green)}button{cursor:pointer;border:1px solid var(--line);border-radius:4px;padding:9px 13px;background:#fff;color:var(--text);font:inherit}button:hover{filter:brightness(.96)}.btn{display:inline-block}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.card{border:1px solid var(--line);border-radius:4px;padding:13px;margin:10px 0;background:#fff}.card h3{margin:0 0 4px}.info{border:1px solid var(--line);background:#fbfdfb;width:100%;max-width:360px;float:right;margin:0 0 18px 22px}.info th{background:var(--pale);color:var(--deep);padding:8px;width:32%}.info td{padding:8px;border-bottom:1px solid var(--line)}.form{display:grid;gap:10px;max-width:650px}.form label{font-weight:600}.muted{color:var(--muted)}.hidden{display:none!important}.notice{padding:10px;background:var(--pale);border-left:4px solid var(--green);margin:12px 0}.footer{color:var(--muted);font-size:12px;text-align:center;padding:25px}.pill{background:var(--pale);color:var(--deep);padding:2px 8px;border-radius:12px;font-size:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:none}.search{order:3;width:100%;margin:0}.article{padding:16px}.info{float:none;margin:0 0 16px;max-width:100%}.title{font-size:24px}}

/* refined green editorial UI */
:root{--green:#147a4b;--deep:#0d5736;--pale:#eaf5ee;--line:#e1e9e3;--text:#17251d;--muted:#718078;--bg:#f3f7f4;--accent:#b8e2c7;--shadow:0 12px 34px rgba(19,65,39,.07)}
*{box-sizing:border-box}
body{background:radial-gradient(ellipse at 12% 0%,#e8f5ec 0,transparent 34%),var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;line-height:1.7;color:var(--text)}
.top{background:rgba(13,87,54,.97);border:0;box-shadow:0 4px 22px rgba(9,50,30,.13);position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}
.topin{max-width:1240px;min-height:76px;padding:12px 24px;gap:26px}
.brand{font-size:22px;letter-spacing:-.7px;line-height:1.2}.brand small{margin-top:5px;letter-spacing:.2px;font-size:10px;color:#c9e8d4}
.nav{gap:20px}.nav a{font-weight:600;color:#e5f4e9;opacity:.9}.nav a:hover{opacity:1;text-decoration:none}
.search{max-width:390px;background:#fff;border-radius:10px;padding:4px;box-shadow:0 2px 8px #063d251c}
.search input{border:0;padding:9px 12px;outline:0}.search button{border:0;border-radius:7px;background:#e8f4ec;color:var(--deep);font-weight:700}
#loginBtn,#logoutBtn{border:1px solid #ffffff55;background:#ffffff12;color:#fff;border-radius:9px;font-weight:650;padding:9px 15px}
.wrap{max-width:1240px;margin:30px auto;padding:0 24px}
.layout{grid-template-columns:218px minmax(0,1fr);gap:24px}
.side,.article{border:1px solid #e4ebe5;border-radius:15px;box-shadow:var(--shadow)}
.side{padding:19px;background:rgba(255,255,255,.88);position:sticky;top:100px}
.side h3{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#829188;border:0;margin:0 0 9px;padding:0}
.side a{padding:9px 11px;border-radius:8px;color:#43584b;font-weight:550;font-size:14px}
.side a:hover{background:#edf6f0;text-decoration:none;color:var(--deep)}
#userBox{padding:9px 11px;font-size:13px;background:#f5f8f5;border-radius:8px;overflow-wrap:anywhere}
.article{padding:34px 38px;min-height:620px;background:rgba(255,255,255,.96)}
.title{font-size:31px;letter-spacing:-1.1px;line-height:1.3;border:0;padding:0 0 16px;margin:0 0 18px;position:relative}
.title:after{content:"";display:block;width:54px;height:4px;background:linear-gradient(90deg,var(--green),#9bd5ae);border-radius:9px;position:absolute;bottom:0;left:0}
h2{font-size:19px;letter-spacing:-.4px;margin:28px 0 12px}
p{color:#425249}
.notice{border:1px solid #d8eddf;border-left:4px solid #31a267;border-radius:10px;background:linear-gradient(100deg,#f0f9f3,#f8fcf9);padding:14px 17px;color:#385a45}
button,.btn{border-radius:9px;font-weight:650;transition:transform .16s,box-shadow .16s,background .16s}
button:hover,.btn:hover{filter:none;transform:translateY(-1px);box-shadow:0 5px 14px #164d2c18}
.btn{background:linear-gradient(135deg,#16834f,#0d6b40);border:0;box-shadow:0 5px 14px #16834f25}
.tabs{gap:9px}.tabs button{border-radius:8px}
.card{border:1px solid #e7eee8;border-radius:12px;padding:17px 19px;margin:12px 0;background:#fff;box-shadow:0 3px 12px rgba(19,65,39,.035);transition:border-color .15s,transform .15s}
.card:hover{border-color:#b9d9c4;transform:translateY(-2px)}
.card h3{font-size:16px;letter-spacing:-.2px}
.card h3 a{color:#176b43}
input,textarea,select{border:1px solid #dce7df;border-radius:9px;padding:11px 13px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:#58a978;box-shadow:0 0 0 3px #16834f18}
.form{gap:13px}.form label{font-size:14px;color:#405248}.form button{justify-self:start}
.info{border:1px solid #dce9df;border-radius:12px;overflow:hidden;background:#fbfdfb;box-shadow:0 5px 18px #174c2b0a}
.info th{background:#edf7f0;color:#285b3c;font-weight:650}.info td,.info th{padding:11px 13px}
.pill{border-radius:99px;font-weight:650}
.footer{padding:32px 10px;color:#849188}
.sub{margin:0 0 22px}
@media(max-width:760px){.top{position:relative}.topin{padding:14px 16px;gap:12px}.nav{order:2;width:100%;gap:18px}.search{order:3;width:100%;max-width:none}.wrap{margin:16px auto;padding:0 13px}.layout{gap:0}.side{display:none}.article{padding:23px 19px;border-radius:12px;min-height:500px}.title{font-size:26px}.footer{padding:22px 8px}}

.profile-card{display:flex;align-items:center;gap:18px;padding:18px;border:1px solid #dce9df;border-radius:14px;background:#f3faf5;margin:18px 0 25px}.discord-avatar{width:76px;height:76px;border-radius:22px;object-fit:cover}.section-head{display:flex;justify-content:space-between;align-items:center}.history-row{padding:9px 0;border-bottom:1px solid #edf1ed;font-size:13px}.danger{color:#a52b2b;border-color:#efcccc}</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="#" data-page="home">Discord Wiki<small>디스코드 인물 사전</small></a><nav class="nav"><a href="#" data-page="home">대문</a><a href="#" data-page="list">인물 목록</a><a href="#" data-page="create">문서 등록</a></nav><form class="search" id="searchForm"><input id="q" placeholder="문서 검색"><button>검색</button></form><button id="loginBtn">Discord 로그인</button><button id="logoutBtn" class="hidden">로그아웃</button></div></header>
<div class="wrap"><div class="layout"><aside class="side"><h3>Discord Wiki</h3><a href="#" data-page="home">대문</a><a href="#" data-page="list">전체 문서</a><a href="#" data-page="create">새 문서 만들기</a><a href="#" data-page="about">소개</a><h3 style="margin-top:18px">계정</h3><div id="userBox" class="muted">로그인되지 않음</div><a href="#" data-page="admin" id="adminLink" class="hidden">운영진 관리</a></aside><main class="article"><div id="app"><h1 class="title">Discord Wiki에 오신 것을 환영합니다</h1><p>디스코드 커뮤니티 인물 정보를 정리하는 공개 위키입니다.</p><div class="notice">문서의 내용은 출처를 바탕으로 작성하고, 개인정보 및 명예훼손에 유의해 주세요.</div><div class="toolbar"><button class="btn" data-page="list">인물 문서 둘러보기</button><button data-page="create">새 문서 등록</button></div><h2>최근 등록 문서</h2><div id="recent">불러오는 중...</div></div></main></div><div class="footer">Discord Wiki · 커뮤니티 기반 인물 사전</div></div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://pyrrcqzokxtnpudffnng.supabase.co','sb_publishable_HdlhAITnkFT8r2e01QfP3Q_Xgx0oyRV');
const $=s=>document.querySelector(s), app=$('#app');let session=null,profile=null,people=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(page){if(page==='home')home();if(page==='list')list();if(page==='create')create();if(page==='about')about();if(page==='admin')admin();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-page]');if(el){e.preventDefault();go(el.dataset.page)}});
$('#loginBtn').onclick=async()=>{const{error}=await supabase.auth.signInWithOAuth({provider:'discord',options:{redirectTo:location.origin}});if(error)alert(error.message)};
$('#logoutBtn').onclick=()=>supabase.auth.signOut();
supabase.auth.onAuthStateChange((_event,s)=>{session=s;syncUser();});
async function syncUser(){if(!session){profile=null;$('#loginBtn').classList.remove('hidden');$('#logoutBtn').classList.add('hidden');$('#userBox').textContent='로그인되지 않음';$('#adminLink').classList.add('hidden');return}$('#loginBtn').classList.add('hidden');$('#logoutBtn').classList.remove('hidden');profile=session.user;$('#userBox').textContent=profile.user_metadata?.full_name||profile.user_metadata?.name||profile.email||'로그인 사용자';const role=profile.app_metadata?.role;$('#adminLink').classList.toggle('hidden',!['admin','moderator'].includes(role));}
async function load(){const{data,error}=await supabase.from('people').select('*').order('created_at',{ascending:false}).limit(100);if(error){$('#recent').textContent='문서 불러오기 실패: '+error.message;return}people=data||[];$('#recent').innerHTML=people.slice(0,8).map(p=>'<div class="card"><h3><a href="#" data-person="'+esc(p.id)+'">'+esc(p.name)+'</a></h3><div class="muted">'+esc(p.description||p.summary||'설명 없음')+'</div></div>').join('')||'등록된 문서가 없습니다.'}
function home(){app.innerHTML='<h1 class="title">Discord Wiki</h1><p>디스코드 커뮤니티 인물 정보를 정리하는 공개 위키입니다.</p><div class="notice">문서의 내용은 출처를 바탕으로 작성하고, 개인정보 및 명예훼손에 유의해 주세요.</div><div class="toolbar"><button class="btn" data-page="list">인물 문서 둘러보기</button><button data-page="create">새 문서 등록</button></div><h2>최근 등록 문서</h2><div id="recent">불러오는 중...</div>';load()}
function list(){app.innerHTML='<h1 class="title">인물 목록</h1><div class="toolbar"><input id="filter" placeholder="이름으로 필터"><select id="sort"><option value="new">최근순</option><option value="az">이름순</option></select></div><div id="peopleList">불러오는 중...</div>';renderList()}
async function renderList(){const{data,error}=await supabase.from('people').select('*').order('created_at',{ascending:false}).limit(300);if(error){$('#peopleList').textContent=error.message;return}people=data||[];const draw=()=>{let a=people.filter(p=>(p.name||'').toLowerCase().includes(($('#filter').value||'').toLowerCase()));if($('#sort').value==='az')a.sort((x,y)=>(x.name||'').localeCompare(y.name||'','ko'));$('#peopleList').innerHTML=a.map(p=>'<div class="card"><h3><a href="#" data-person="'+esc(p.id)+'">'+esc(p.name)+'</a></h3><div class="muted">'+esc(p.description||p.summary||'')+'</div></div>').join('')||'검색 결과가 없습니다.'};$('#filter').oninput=draw;$('#sort').onchange=draw;draw()}
document.addEventListener('click',async e=>{const a=e.target.closest('[data-person]');if(!a)return;e.preventDefault();const p=people.find(x=>String(x.id)===a.dataset.person);if(p)detail(p)});
function detail(p){app.innerHTML='<h1 class="title">'+esc(p.name)+'</h1><div class="sub">Discord Wiki 문서</div><table class="info"><tr><th>이름</th><td>'+esc(p.name)+'</td></tr><tr><th>Discord ID</th><td>'+esc(p.discord_id||'미상')+'</td></tr><tr><th>별칭</th><td>'+esc(p.aliases||'없음')+'</td></tr></table><h2>개요</h2><p>'+esc(p.description||p.summary||'등록된 설명이 없습니다.')+'</p><div style="clear:both"></div><div class="toolbar"><button onclick="window.dispatchEvent(new CustomEvent(\'report\',{detail:'+JSON.stringify(p.id)+'}))">신고</button><button onclick="window.dispatchEvent(new CustomEvent(\'deleteReq\',{detail:'+JSON.stringify(p.id)+'}))">삭제 요청</button></div><div id="extra"></div>';window.currentPerson=p}
function create(){if(!session){app.innerHTML='<h1 class="title">문서 등록</h1><p>문서를 등록하려면 Discord 로그인이 필요합니다.</p>';return}app.innerHTML='<h1 class="title">새 문서 등록</h1><form id="createForm" class="form"><label>이름<input name="name" required maxlength="100"></label><label>Discord ID<input name="discord_id"></label><label>별칭<input name="aliases"></label><label>개요<textarea name="description" rows="6"></textarea></label><button class="btn">문서 등록</button></form>';$('#createForm').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));v.created_by=session.user.id;v.updated_by=session.user.id;const{error}=await supabase.from('people').insert(v);if(error)alert(error.message);else{alert('문서가 등록되었습니다.');go('list')}}}
window.addEventListener('report',e=>requestForm('reports',e.detail,'신고 접수'));window.addEventListener('deleteReq',e=>requestForm('deletion_requests',e.detail,'삭제 요청'));
function requestForm(table,id,title){if(!session){alert('로그인이 필요합니다.');return}app.innerHTML='<h1 class="title">'+title+'</h1><form id="req" class="form"><label>사유<select name="reason"><option>허위 정보</option><option>개인정보</option><option>괴롭힘</option><option>저작권</option><option>스팸</option><option>기타</option></select></label><label>상세 내용<textarea name="details" rows="5"></textarea></label><button class="btn">접수하기</button></form>';$('#req').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));const{error}=await supabase.from(table).insert({person_id:id,requester_id:session.user.id,...v});if(error)alert(error.message);else{alert('접수되었습니다.');go('home')}}}
function about(){app.innerHTML='<h1 class="title">Discord Wiki 소개</h1><p>Discord Wiki는 디스코드 커뮤니티의 인물 정보를 정리하는 위키입니다.</p>'}
async function admin(){if(!['admin','moderator'].includes(session?.user?.app_metadata?.role)){app.innerHTML='<h1 class="title">접근 권한 없음</h1>';return}app.innerHTML='<h1 class="title">운영진 관리</h1><p>신고 및 삭제 요청을 관리합니다.</p><div id="reports">불러오는 중...</div>';for(const t of ['reports','deletion_requests']){const{data,error}=await supabase.from(t).select('*').order('created_at',{ascending:false}).limit(100);$('#reports').innerHTML+= '<h2>'+t+'</h2>'+(error?esc(error.message):(data||[]).map(x=>'<div class="card">요청 '+esc(x.id)+' · '+esc(x.reason)+' · '+esc(x.status||'pending')+'</div>').join(''))}}
$('#searchForm').onsubmit=async e=>{e.preventDefault();const term=$('#q').value.trim();await list();const f=$('#filter');if(f){f.value=term;f.dispatchEvent(new Event('input'))}};

function staff(){return ['admin','moderator'].includes(session?.user?.app_metadata?.role)}
function dateText(v){return v?new Date(v).toLocaleString('ko-KR'):'날짜 미상'}
function detail(p){window.currentPerson=p;const avatar='https://cdn.discordapp.com/embed/avatars/'+(Math.abs(parseInt(p.discord_id||'0',10)||0)%6)+'.png';app.innerHTML='<div class="sub">인물 문서 · '+dateText(p.updated_at)+'</div><h1 class="title">'+esc(p.name)+'</h1><div class="profile-card"><img class="discord-avatar" src="'+avatar+'"><div><strong>'+esc(p.name)+'</strong><div class="muted">Discord 프로필</div><code>'+esc(p.discord_id||'Discord ID 미등록')+'</code><p>'+(p.discord_id?'<button id="copyDiscord">ID 복사</button> <a target="_blank" rel="noopener" href="https://discord.com/users/'+encodeURIComponent(p.discord_id)+'">Discord에서 열기 ↗</a>':'')+'</p></div></div><h2>개요</h2><p>'+esc(p.description||'등록된 설명이 없습니다.').replace(/\n/g,'<br>')+'</p><h2>출처 <button id="addSource">출처 추가</button></h2><div id="sourceItems">불러오는 중...</div><h2>수정 이력</h2><div id="historyItems">불러오는 중...</div><div class="toolbar"><button id="reportNew">신고</button><button id="deleteNew">삭제 요청</button>'+(session?'<button id="editNew" class="btn">문서 수정</button>':'')+'</div><div id="detailForm"></div>';
$('#copyDiscord')?.addEventListener('click',()=>navigator.clipboard.writeText(p.discord_id));$('#addSource').onclick=()=>sourceFormNew(p);$('#editNew')?.addEventListener('click',()=>editNew(p));$('#reportNew').onclick=()=>requestNew(p,true);$('#deleteNew').onclick=()=>requestNew(p,false);
supabase.from('people_sources').select('*').eq('person_id',p.id).order('created_at',{ascending:false}).then(r=>$('#sourceItems').innerHTML=(r.data||[]).map(s=>'<div class="card"><a target="_blank" href="'+esc(s.url)+'">'+esc(s.title)+'</a><p>'+esc(s.note||'')+'</p><small>'+dateText(s.created_at)+' '+((session&&s.created_by===session.user.id)||staff()?'<button data-source-remove="'+s.id+'">삭제</button>':'')+'</small></div>').join('')||'출처가 없습니다.');
supabase.from('people_edit_history').select('*').eq('person_id',p.id).order('created_at',{ascending:false}).limit(30).then(r=>$('#historyItems').innerHTML=(r.data||[]).map(h=>'<div class="history-row">'+(h.action==='delete'?'삭제':'수정')+' · '+dateText(h.created_at)+' · '+esc(h.person_name_snapshot||'')+'</div>').join('')||'수정 이력이 없습니다.');
}
function editNew(p){$('#detailForm').innerHTML='<h2>문서 수정</h2><form id="editNewForm" class="form"><label>이름<input name="name" required value="'+esc(p.name)+'"></label><label>Discord ID<input name="discord_id" value="'+esc(p.discord_id||'')+'"></label><label>별칭 (쉼표 구분)<input name="aliases" value="'+esc((p.aliases||[]).join(', '))+'"></label><label>개요<textarea name="description" rows="6">'+esc(p.description||'')+'</textarea></label><button class="btn">저장</button></form>';$('#editNewForm').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.aliases=v.aliases.split(',').map(x=>x.trim()).filter(Boolean);v.updated_by=session.user.id;let r=await supabase.from('people').update(v).eq('id',p.id);if(r.error)alert(r.error.message);else{let q=await supabase.from('people').select('*').eq('id',p.id).single();detail(q.data)}}}
function sourceFormNew(p){if(!session){alert('로그인이 필요합니다.');return}$('#detailForm').innerHTML='<h2>출처 추가</h2><form id="sourceNewForm" class="form"><label>출처 제목<input name="title" required></label><label>URL<input name="url" type="url" required placeholder="https://"></label><label>메모<textarea name="note"></textarea></label><button class="btn">저장</button></form>';$('#sourceNewForm').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.person_id=p.id;v.created_by=session.user.id;let r=await supabase.from('people_sources').insert(v);if(r.error)alert(r.error.message);else detail(p)}}
function requestNew(p,report){if(!session){alert('로그인이 필요합니다.');return}$('#detailForm').innerHTML='<h2>'+(report?'신고':'삭제 요청')+'</h2><form id="requestNewForm" class="form">'+(report?'<label>사유<select name="reason"><option value="false_information">허위 정보</option><option value="privacy">개인정보</option><option value="harassment">괴롭힘</option><option value="copyright">저작권</option><option value="spam">스팸</option><option value="other">기타</option></select></label>':'<label>요청 사유<input name="reason" required maxlength="200"></label>')+'<label>상세 내용<textarea name="details"></textarea></label><button class="btn">접수</button></form>';$('#requestNewForm').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.person_id=p.id;v.person_name_snapshot=p.name;v[report?'reporter_id':'requester_id']=session.user.id;let r=await supabase.from(report?'reports':'deletion_requests').insert(v);if(r.error)alert(r.error.message);else $('#detailForm').innerHTML='<div class="notice">접수되었습니다.</div>'}}
async function create(){if(!session){app.innerHTML='<h1 class="title">문서 등록</h1><p>Discord 로그인이 필요합니다.</p>';return}app.innerHTML='<h1 class="title">문서 등록</h1><form id="createNew" class="form"><label>이름<input name="name" required maxlength="80"></label><label>Discord ID<input name="discord_id"></label><label>별칭<input name="aliases" placeholder="쉼표로 구분"></label><label>개요<textarea name="description" rows="6"></textarea></label><button class="btn">등록</button></form>';$('#createNew').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.aliases=v.aliases.split(',').map(x=>x.trim()).filter(Boolean);v.created_by=session.user.id;v.updated_by=session.user.id;let r=await supabase.from('people').insert(v).select().single();if(r.error)alert(r.error.message);else detail(r.data)}}
async function list(){app.innerHTML='<h1 class="title">인물 목록</h1><div class="toolbar"><input id="filter" placeholder="이름·별칭·Discord ID 검색"><select id="sourceFilter"><option value="all">전체</option><option value="yes">출처 있음</option><option value="no">출처 없음</option></select><select id="sort"><option value="new">최근순</option><option value="az">이름순</option><option value="old">오래된순</option></select></div><div id="peopleList">불러오는 중...</div>';let r=await supabase.from('people').select('*').order('created_at',{ascending:false});if(r.error){$('#peopleList').textContent=r.error.message;return}people=r.data||[];let s=await supabase.from('people_sources').select('person_id'),ids=new Set((s.data||[]).map(x=>x.person_id));function draw(){let a=people.filter(p=>([p.name,...(p.aliases||[]),p.discord_id||''].join(' ').toLowerCase()).includes($('#filter').value.toLowerCase()));if($('#sourceFilter').value==='yes')a=a.filter(p=>ids.has(p.id));if($('#sourceFilter').value==='no')a=a.filter(p=>!ids.has(p.id));if($('#sort').value==='az')a.sort((x,y)=>x.name.localeCompare(y.name,'ko'));if($('#sort').value==='old')a.sort((x,y)=>new Date(x.created_at)-new Date(y.created_at));$('#peopleList').innerHTML=a.map(p=>'<div class="card"><h3><a href="#" data-person="'+p.id+'">'+esc(p.name)+'</a></h3><p>'+esc((p.description||'').slice(0,120))+'</p></div>').join('')||'검색 결과가 없습니다.'}['filter','sort','sourceFilter'].forEach(id=>{ $('#'+id).oninput=draw;$('#'+id).onchange=draw});draw()}
async function admin(){if(!['admin','moderator'].includes(session?.user?.app_metadata?.role)){app.innerHTML='<h1 class="title">접근 권한 없음</h1>';return}app.innerHTML='<h1 class="title">운영진 관리</h1><div class="tabs"><button id="reportsTab">신고</button><button id="deletionsTab">삭제 요청</button></div><div id="adminRows"></div>';$('#reportsTab').onclick=()=>loadRequests('reports');$('#deletionsTab').onclick=()=>loadRequests('deletion_requests');loadRequests('reports')}
async function loadRequests(t){let r=await supabase.from(t).select('*').order('created_at',{ascending:false});if(r.error){$('#adminRows').textContent=r.error.message;return}$('#adminRows').innerHTML=(r.data||[]).map(x=>'<div class="card"><strong>'+esc(x.person_name_snapshot)+'</strong> · '+esc(x.status)+'<p>'+esc(x.reason)+' — '+esc(x.details||'')+'</p><select data-status="'+x.id+'">'+(t==='reports'?['open','reviewing','resolved','rejected']:['open','reviewing','approved','rejected']).map(s=>'<option '+(s===x.status?'selected':'')+'>'+s+'</option>').join('')+'</select> <button data-update-request="'+x.id+'" data-table="'+t+'">상태 저장</button>'+(t==='deletion_requests'?'<button class="danger" data-approve-request="'+x.id+'" data-person="'+x.person_id+'">승인 및 문서 삭제</button>':'')+'</div>').join('')||'요청이 없습니다.'}
document.addEventListener('click',async e=>{let rm=e.target.closest('[data-source-remove]');if(rm){if(!confirm('출처를 삭제할까요?'))return;let r=await supabase.from('people_sources').delete().eq('id',rm.dataset.sourceRemove);if(r.error)alert(r.error.message);else detail(window.currentPerson)}let b=e.target.closest('[data-update-request]');if(b){let status=document.querySelector('[data-status="'+b.dataset.updateRequest+'"]').value,r=await supabase.from(b.dataset.table).update({status,reviewed_at:new Date().toISOString(),reviewed_by:session.user.id}).eq('id',b.dataset.updateRequest);if(r.error)alert(r.error.message);else loadRequests(b.dataset.table)}let d=e.target.closest('[data-approve-request]');if(d){if(!confirm('문서를 영구 삭제할까요?'))return;let pid=d.dataset.person;let r=await supabase.from('people_sources').delete().eq('person_id',pid);if(r.error){alert('출처 정리 실패: '+r.error.message);return}r=await supabase.from('people').delete().eq('id',pid);if(r.error){alert('문서 삭제 실패: '+r.error.message);return}r=await supabase.from('deletion_requests').update({status:'approved',reviewed_at:new Date().toISOString(),reviewed_by:session.user.id}).eq('id',d.dataset.approveRequest);if(r.error)alert('문서는 삭제됐지만 요청 상태 변경 실패: '+r.error.message);loadRequests('deletion_requests')}});

async function init(){const{data}=await supabase.auth.getSession();session=data.session;await syncUser();home()}init();
